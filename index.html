 function start(){clearInterval(cd);st.n++;st.en=true;st.pv=c.pub;st.h.push({debut:iso()});sv();
  Q=shuf(c.banque.slice()).slice(0,N).map(q=>{let h=q.choix.map((x,i)=>({x,ok:i==q.bonne}));if(o.mix)h=shuf(h);return{id:q.id,theme:q.theme,q:q.enonce,ch:h.map(z=>z.x),ok:h.findIndex(z=>z.ok),dur:q.dur>0?q.dur:c.dur}});

${c.cert?`<h3>Degré de certitude</h3><div class=g4>${[1,2,3,4].map(k=>`<label class=op><input type=radio name=ct value=${k}>${k}</label>`).join('')}</div><p class=m>1 : très incertain, 4 : très certain</p>`:''}<p class=ko id=er role=alert></p><button id=ok>Valider ma réponse</button></div>`;
  if(ech||tdl){const tk=()=>{sv();const n=tn();if(tdl&&n>=tdl)return endAll();if(ech){left=Math.max(0,Math.ceil((ech-n)/1000));showT()}showTot();if(ech&&ech-n<=0)submit(true)};tk();tm=setInterval(tk,1000)}

 function submit(auto){

 function finish(){stop();const D1=new Date();st.en=false;st.p=null;st.h.push({fin:iso(),issue:'terminée'});

 const tbl=()=>`<div class=tw><table><tr><th>N°</th><th>Question</th><th>Votre réponse</th>${o.corr?'<th>Bonne réponse</th>':''}${c.cert?'<th>Certitude</th>':''}${o.corr&&c.cert?'<th>Points</th>':''}${o.corr?'<th>Résultat</th>':''}</tr>${A.map(a=>`<tr><td>${a.ordre}</td><td>${esc(a.enonce)}</td><td>${esc(a.reponse)}</td>${o.corr?'<td>'+esc(a.bonneReponse)+'</td>':''}${c.cert?'<td>'+(a.certitude||'-')+'</td>':''}${o.corr&&c.cert?'<td>'+r2(pts(c.coef,c.cert,a))+'</td>':''}${o.corr?`<td class=${a.correct?'ok':'ko'}>${a.correct?'Correct':a.repondu?'Faux':'Sans réponse'}</td>`:''}</tr>`).join('')}</table></div>`;
 function pdf(res){

  cell=a=>{const r=[a.ordre,a.enonce,a.reponse];if(corr)r.push(a.bonneReponse);if(ce)r.push(a.certitude||'-');if(corr&&ce)r.push(r2(pts(c.coef,c.cert,a)));if(corr)r.push(a.correct?'Correct':a.repondu?'Faux':'Sans réponse');return r.map(String)};
  let y=0;

  d.setFont('helvetica','normal');d.setFontSize(10);d.text('Compte rendu de test',M,22);d.text(new Date(res.fin).toLocaleString('fr-FR'),W-M,22,{align:'right'});

   const x=M+(i%2)*(CW/2),yy=y+Math.floor(i/2)*7;d.setFont('helvetica','bold');d.text(k+' :',x,yy);d.setFont('helvetica','normal');d.text(d.splitTextToSize(String(v),CW/2-34)[0]||'',x+32,yy)});
  y+=26;
  if(corr){d.setFillColor(238,243,250);d.roundedRect(M,y,CW,16,2,2,'F');d.setFont('helvetica','bold');d.setFontSize(13);d.text('Score : '+res.score+' sur '+mx+(mx>0?'   ('+Math.round(100*Math.max(0,res.score)/mx)+' %)':''),M+5,y+10.5);d.setFontSize(10);y+=24}
  else{d.setFont('helvetica','normal');d.text('Vos réponses ont été enregistrées.',M,y);y+=10}
  const th=()=>{d.setFillColor(29,78,137);d.rect(M,y,CW,7,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(9);let x=M;C.forEach(([n,w])=>{d.text(n,x+1.5,y+4.8);x+=w});y+=7;d.setTextColor(30);d.setFont('helvetica','normal')};
  th();

   if(y+h>284){d.addPage();y=M;th()}

  g('dj').onclick=()=>down(res);g('pdfb').onclick=()=>{try{pdf(res)}catch(e){g('er').textContent='PDF impossible : '+e.message}};if(g('again'))g('again').onclick=()=>begin()}
 /* démarrage : élève déjà identifié sur cet appareil */
 if(I.classe&&I.identifiant){st=ld();if(st.en){if(o.ac)dep('fermeture');else st.en=false}sv();if(st.bl>tn())return blocked();if(st.bl){st.bl=0;st.d=0;sv()}if(st.p)return pause('');if(st.n>=st.a)return maxed()}
